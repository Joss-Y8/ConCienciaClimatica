<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso</title>
    <link rel="icon" href="../assets/img/logos/churrumaiss_sin_fondo.png" type="image/png">
    <script src="https://kit.fontawesome.com/55078876e9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/sesion.css">
</head>
<body>
    <div class="main-container" id="main-container">

        <!--Panel izquierdo de imagen-->
        <div class="left-panel" id="left-panel">
            <div class="overlay-content" id="overlay-content">
                 <a href="../index.html"><img src="../assets/img/logos/concienciaclimática_sin_fondo.png" alt="Logo" class="logo"></a>
                <h1>ConCienciaClimática</h1>
                <p id="mensaje">Un planeta más verde, comienza con una mente informada.</p>
            </div>
        </div>

        <!--Panel izquierdo de formularios-->
        <div class="right-panel">
            <!--LOGIN-->
            <div class="form-container" id="login-form">
                <h2>Bienvenido</h2>
                <p>Inicia sesión para continuar</p>
                <form id="formLogin">
                <input type="email" name="correo" placeholder="Correo electrónico"/>
                <input type="password" name="password" placeholder="Contraseña"/>

                <div id="login-message" class="mensaje-error"></div>
                <button type="submit">Iniciar sesión</button>
                </form>
                <br>
                <p>¿No tienes cuenta? <a href="#" onclick="mostrarRegistro()">Regístrate</a></p>

                <p class="opcional">¡Visitanos!</p>
                <div class="social-buttons">
                    <button class="instagram"><a href="https://www.instagram.com/c_ss.hw?igsh=MTVidmM1MXZndmE0ZQ==" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a></button>
                    <button class="facebook"><a href="https://www.facebook.com/profile.php?id=61569423481737&mibextid=ZbWKwL" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i></a></button>
                </div>
                
            </div>
            <!--REGISTRO-->
             <div class="form-container hidden" id="register-form">
                <h2>Registro</h2>
                <p>Completa tu información</p>
                <form id="formSignup">
                <div class="nombre-apellido col-4">
                    <input type="text" name="nombre" placeholder="Nombre"/>
                    <input type="text" name="apellido" placeholder="Apellido"/>
                </div>
                <input type="email" name="correo" placeholder="Correo electrónico"/>
                <input type="password" name="password" placeholder="Contraseña"/>
                <input type="password" name="passwordc" placeholder="Confirma contraseña"/>
                <div id="signup-message" class="mensaje-error"></div>
                <input type="number" name="edad" placeholder="Edad"/>
                <label for="city"></label>
                    <select name="city" id="city" required>
                        <option selected disabled>Selecciona tu municipio</option>
                        <option>Puebla</option>
                        <option>Teziutlán</option>
                        <option>Tehuacán</option>
                        <option>Atlixco</option>
                        <option>Ciudad de Zacatlán</option>
                        <option>Huauchinango</option>
                        <option>Chignahuapan</option>
                        <option>San Pedro Cholula</option>
                        <option>Izúcar de Matamoros</option>
                        <option>Otro</option>
                    </select>
                    <button type="submit">Registrarse</button>
                </form>
                <br>
                 <p>¿Ya tienes cuenta? <a href="#" onclick="mostrarLogin()">Inicia sesión</a></p>

                <p class="opcional">¡Visitanos!</p>
                <div class="social-buttons">
                    <button class="instagram"><a href="https://www.instagram.com/c_ss.hw?igsh=MTVidmM1MXZndmE0ZQ==" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a></button>
                    <button class="facebook"><a href="https://www.facebook.com/profile.php?id=61569423481737&mibextid=ZbWKwL" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i></a></button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/sesion.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="js/validacion_login_registro.js"></script>


</body>
</html>
